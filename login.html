<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>登录 · 清晰思考。笃定决策</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- External Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    (function() {
      // 主题初始化（防闪烁）：与首页 index.html 一致
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialTheme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', initialTheme);
    })();
  </script>

  <style>
    /* RESET & TOKENS（与 index.html 视觉语言一致） */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html {
      font-size: 16px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0c0c0c;
      --text: #ffffff;
      --box: #111111;
      --box2: #151515;
      --hairline: rgba(255, 255, 255, 0.065);
      --hairline-strong: rgba(255, 255, 255, 0.30);
      --heading: #fafafa;
      --subtitle: #9e9e9e;
      --placeholder: #6b6b6d;
      --chip-fill: rgba(255, 255, 255, 0.028);
      --chip-hover: rgba(255, 255, 255, 0.06);
      --icon: #e8e8e8;
      --btn-pill-bg: #ffffff;
      --btn-pill-text: #0c0c0c;
      --logo-ray: #f4f4f4;
      --logo-center: #fbfbfb;
      --input-bg: #0e0e0e;
      --input-focus-ring: rgba(255, 212, 0, 0.22);
      --overlay-glow: radial-gradient(circle at 78% 12%, rgba(255, 230, 100, 0.10) 0%, transparent 55%),
                      radial-gradient(circle at 20% 88%, rgba(120, 208, 205, 0.10) 0%, transparent 55%);
      --danger: #ff6b6b;
    }

    :root[data-theme="light"] {
      --bg: #f7f7f8;
      --text: #0f0f11;
      --box: #ffffff;
      --box2: #fbfbfc;
      --hairline: rgba(0, 0, 0, 0.08);
      --hairline-strong: rgba(0, 0, 0, 0.15);
      --heading: #111111;
      --subtitle: #616164;
      --placeholder: #9a9aa0;
      --chip-fill: rgba(0, 0, 0, 0.035);
      --chip-hover: rgba(0, 0, 0, 0.07);
      --icon: #222222;
      --btn-pill-bg: #111111;
      --btn-pill-text: #ffffff;
      --logo-ray: #222222;
      --logo-center: #111111;
      --input-bg: #f2f2f4;
      --input-focus-ring: rgba(255, 212, 0, 0.28);
      --overlay-glow: radial-gradient(circle at 78% 12%, rgba(255, 230, 100, 0.18) 0%, transparent 55%),
                      radial-gradient(circle at 20% 88%, rgba(120, 208, 205, 0.18) 0%, transparent 55%);
      --danger: #e5484d;
    }

    :root {
      --grad: linear-gradient(90deg,
        rgba(255, 232, 120, 0) 0%, #ffe776 6%, #ffd400 26%, #ffd000 42%,
        #c9c93c 60%, #86ca8a 74%, #78d0cd 88%, rgba(120, 208, 205, 0.55) 100%);
      --grad-solid: linear-gradient(90deg,
        #ffe776 0%, #ffd400 22%, #ffd000 40%, #c9c93c 60%, #86ca8a 76%, #78d0cd 100%);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background-image: var(--overlay-glow);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    a { color: inherit; text-decoration: none; }
    button { background: none; border: none; font: inherit; color: inherit; cursor: pointer; }

    /* 主题切换按钮（右上角，与首页一致） */
    .theme-toggle-btn {
      position: fixed;
      top: clamp(20px, 3vw, 34px);
      right: clamp(20px, 3vw, 34px);
      width: clamp(38px, 3vw, 44px);
      height: clamp(38px, 3vw, 44px);
      border-radius: 50%;
      border: 1px solid var(--hairline-strong);
      background: var(--chip-fill);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.18s ease, transform 0.15s ease;
    }
    .theme-toggle-btn:hover { background: var(--chip-hover); transform: scale(1.06); }
    .theme-toggle-btn svg { width: 18px; height: 18px; stroke: currentColor; }
    :root[data-theme="dark"] .icon-sun { display: block; }
    :root[data-theme="dark"] .icon-moon { display: none; }
    :root[data-theme="light"] .icon-sun { display: none; }
    :root[data-theme="light"] .icon-moon { display: block; }

    /* 登录卡片 */
    .auth-card {
      width: min(100%, 420px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.028), rgba(255, 255, 255, 0) 42%), var(--box);
      border: 1px solid var(--hairline);
      border-radius: clamp(18px, 2.4vw, 26px);
      box-shadow: 0 4px 40px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      padding: clamp(28px, 4.4vw, 44px) clamp(22px, 3.6vw, 36px);
      position: relative;
      overflow: hidden;
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    :root[data-theme="dark"] .auth-card {
      box-shadow: 0 2px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--grad);
      opacity: 0.85;
    }

    /* 品牌区 */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: clamp(20px, 3vw, 30px);
    }

    .brand-logo { width: clamp(44px, 6vw, 58px); height: clamp(44px, 6vw, 58px); display: block; }

    .brand-title {
      margin-top: 14px;
      font-weight: 500;
      font-size: clamp(1.3rem, 2.6vw, 1.7rem);
      letter-spacing: -0.02em;
      color: var(--heading);
    }

    .brand-sub {
      margin-top: 6px;
      font-size: clamp(0.82rem, 1.1vw, 0.92rem);
      color: var(--subtitle);
      letter-spacing: 0.01em;
    }

    /* 登录 / 注册 Tab */
    .tab-switch {
      display: flex;
      background: var(--input-bg);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: clamp(18px, 2.6vw, 24px);
    }

    .tab-item {
      flex: 1;
      padding: 9px 0;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--subtitle);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .tab-item.active {
      background: var(--grad-solid);
      color: #0c0c0c;
    }

    /* 表单 */
    .form-group { margin-bottom: 16px; }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--subtitle);
      margin-bottom: 7px;
      letter-spacing: 0.01em;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 12px 16px;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
    }

    .form-input::placeholder { color: var(--placeholder); }

    .form-input:focus {
      border-color: #ffd000;
      box-shadow: 0 0 0 3px var(--input-focus-ring);
    }

    /* 主按钮 */
    .btn-primary {
      width: 100%;
      margin-top: 8px;
      padding: 13px 0;
      border-radius: 999px;
      background: var(--grad-solid);
      color: #0c0c0c;
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      position: relative;
      overflow: hidden;
      transition: filter 0.18s ease, transform 0.1s ease;
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    /* 错误 / 提示信息 */
    .form-msg {
      margin-top: 14px;
      min-height: 1.2em;
      text-align: center;
      font-size: 0.82rem;
      color: var(--danger);
    }
    .form-msg.ok { color: #23d92c; }

    /* 辅助链接 */
    .form-foot {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--subtitle);
    }
    .form-foot a {
      color: var(--heading);
      transition: opacity 0.18s ease;
    }
    .form-foot a:hover { opacity: 0.75; }

    /* 切换表单淡入 */
    .form-panel { display: none; }
    .form-panel.active { display: block; animation: panel-in 0.28s ease; }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 页脚小字 */
    .page-foot {
      position: fixed;
      bottom: 22px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: var(--subtitle);
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      .page-foot { position: static; margin-top: 18px; }
      body { flex-direction: column; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- 主题切换 -->
  <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="切换浅色/深色主题">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"></circle>
      <line x1="12" y1="2" x2="12" y2="4"></line>
      <line x1="12" y1="20" x2="12" y2="22"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="2" y1="12" x2="4" y2="12"></line>
      <line x1="20" y1="12" x2="22" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <!-- 登录卡片 -->
  <div class="auth-card">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 52 52" aria-hidden="true">
        <g class="rays" stroke="var(--logo-ray)" stroke-width="1.4" stroke-linecap="round"></g>
        <circle cx="26" cy="26" r="7.4" fill="var(--logo-center)"></circle>
      </svg>
      <div class="brand-title">清晰思考。笃定决策</div>
      <div class="brand-sub">编程答疑 Agent · 登录后开始提问</div>
    </div>

    <div class="tab-switch" role="tablist">
      <button class="tab-item active" id="tabLogin" role="tab">登 录</button>
      <button class="tab-item" id="tabRegister" role="tab">注 册</button>
    </div>

    <!-- 登录表单 -->
    <div class="form-panel active" id="panelLogin">
      <div class="form-group">
        <label class="form-label" for="loginUser">用户名</label>
        <input class="form-input" id="loginUser" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPass">密码</label>
        <input class="form-input" id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="loginBtn">登 录</button>
      <div class="form-msg" id="loginMsg"></div>
    </div>

    <!-- 注册表单 -->
    <div class="form-panel" id="panelRegister">
      <div class="form-group">
        <label class="form-label" for="regUser">用户名</label>
        <input class="form-input" id="regUser" placeholder="2-32 个字符" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="regPass">密码</label>
        <input class="form-input" id="regPass" type="password" placeholder="至少 6 位" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" for="regPass2">确认密码</label>
        <input class="form-input" id="regPass2" type="password" placeholder="再次输入密码" autocomplete="new-password">
      </div>
      <button class="btn-primary" id="registerBtn">注 册</button>
      <div class="form-msg" id="regMsg"></div>
    </div>

    <div class="form-foot">
      <a href="/" title="返回首页">← 返回首页</a>
      <span>本地测试账号 demo / 123456</span>
    </div>
  </div>

  <div class="page-foot">重塑推理逻辑的 AI 工作空间 · 编程答疑 Agent</div>

  <script>
    (function() {
      // ---- 主题切换 ----
      var themeToggleBtn = document.getElementById('themeToggleBtn');
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      }
      themeToggleBtn.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme') || 'dark';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });

      // ---- Logo 放射线生成（与首页一致：24 条） ----
      var raysGroup = document.querySelector('.brand-logo .rays');
      if (raysGroup) {
        var cx = 26, cy = 26, rIn = 10.4, rOut = 22.6, numRays = 24;
        for (var i = 0; i < numRays; i++) {
          var angle = -Math.PI / 2 + (i * 2 * Math.PI) / numRays;
          var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', (cx + rIn * Math.cos(angle)).toFixed(2));
          line.setAttribute('y1', (cy + rIn * Math.sin(angle)).toFixed(2));
          line.setAttribute('x2', (cx + rOut * Math.cos(angle)).toFixed(2));
          line.setAttribute('y2', (cy + rOut * Math.sin(angle)).toFixed(2));
          raysGroup.appendChild(line);
        }
      }

      // ---- Tab 切换 ----
      var tabLogin = document.getElementById('tabLogin');
      var tabRegister = document.getElementById('tabRegister');
      var panelLogin = document.getElementById('panelLogin');
      var panelRegister = document.getElementById('panelRegister');
      var loginMsg = document.getElementById('loginMsg');
      var regMsg = document.getElementById('regMsg');

      function switchTab(which) {
        var isLogin = which === 'login';
        tabLogin.classList.toggle('active', isLogin);
        tabRegister.classList.toggle('active', !isLogin);
        panelLogin.classList.toggle('active', isLogin);
        panelRegister.classList.toggle('active', !isLogin);
        loginMsg.textContent = '';
        regMsg.textContent = '';
      }
      tabLogin.addEventListener('click', function() { switchTab('login'); });
      tabRegister.addEventListener('click', function() { switchTab('register'); });

      // ---- API 调用 ----
      function showMsg(el, text, ok) {
        el.textContent = text;
        el.className = 'form-msg' + (ok ? ' ok' : '');
      }

      async function post(path, body) {
        var res = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        var data = null;
        try { data = await res.json(); } catch (e) {}
        if (!res.ok) throw new Error((data && data.detail) || ('HTTP ' + res.status));
        return data;
      }

      async function doLogin() {
        var u = document.getElementById('loginUser').value.trim();
        var p = document.getElementById('loginPass').value;
        var btn = document.getElementById('loginBtn');
        if (!u || !p) { showMsg(loginMsg, '请填写用户名和密码'); return; }
        btn.disabled = true;
        showMsg(loginMsg, '登录中…', true);
        try {
          var d = await post('/api/auth/login', { username: u, password: p });
          localStorage.setItem('agent_token', d.token);
          localStorage.setItem('agent_username', d.username);
          window.location.href = '/chat.html';
        } catch (e) {
          showMsg(loginMsg, '登录失败：' + e.message);
        } finally {
          btn.disabled = false;
        }
      }

      async function doRegister() {
        var u = document.getElementById('regUser').value.trim();
        var p = document.getElementById('regPass').value;
        var p2 = document.getElementById('regPass2').value;
        var btn = document.getElementById('registerBtn');
        if (!u || !p) { showMsg(regMsg, '请填写用户名和密码'); return; }
        if (p !== p2) { showMsg(regMsg, '两次输入的密码不一致'); return; }
        btn.disabled = true;
        showMsg(regMsg, '注册中…', true);
        try {
          var d = await post('/api/auth/register', { username: u, password: p });
          localStorage.setItem('agent_token', d.token);
          localStorage.setItem('agent_username', d.username);
          window.location.href = '/chat.html';
        } catch (e) {
          showMsg(regMsg, '注册失败：' + e.message);
        } finally {
          btn.disabled = false;
        }
      }

      document.getElementById('loginBtn').addEventListener('click', doLogin);
      document.getElementById('registerBtn').addEventListener('click', doRegister);

      // Enter 提交
      ['loginUser', 'loginPass'].forEach(function(id) {
        document.getElementById(id).addEventListener('keydown', function(e) {
          if (e.key === 'Enter') doLogin();
        });
      });
      ['regUser', 'regPass', 'regPass2'].forEach(function(id) {
        document.getElementById(id).addEventListener('keydown', function(e) {
          if (e.key === 'Enter') doRegister();
        });
      });
    })();
  </script>
</body>
</html>
